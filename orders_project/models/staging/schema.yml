version: 2

models:
  - name: stg_orders
    description: One row per order, cleaned up. Amounts are in dollars.
    columns:
      - name: order_id
        description: Unique ID for each order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: The customer who placed the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        description: Either completed or cancelled.
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'cancelled']

  - name: stg_customers
    description: One row per customer, with names and emails tidied up.
    columns:
      - name: customer_id
        description: Unique ID for each customer.
        data_tests:
          - unique
          - not_null
      - name: email
        description: Lowercased email address.
